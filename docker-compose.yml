# Demo stack. Credentials here are local-only defaults; Postgres is not published to the host.
x-py: &py
  image: nexo-py
  environment:
    DATABASE_URL: postgresql://nexo:nexo@postgres:5432/nexo
    NEXO_DATA_DIR: /demo-data
    MOCK_SOURCES_URL: http://mock-sources:8001
    NEXO_DEMO_USERS: "1" # seeds the demo sign-ins listed in the README; remove outside a demo
    # The assistant's model (README, "Asking the assistant"): the keyless mock unless set in the
    # shell or in a .env file next to this one.
    NEXO_MODEL_PROVIDER: ${NEXO_MODEL_PROVIDER:-mock}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    NEXO_CLAUDE_MODEL: ${NEXO_CLAUDE_MODEL:-}
    NEXO_OPENAI_BASE_URL: ${NEXO_OPENAI_BASE_URL:-}
    NEXO_OPENAI_MODEL: ${NEXO_OPENAI_MODEL:-}
    NEXO_OPENAI_API_KEY: ${NEXO_OPENAI_API_KEY:-}
    # Email delivery (README, "Actions"): without a host, approved emails are only logged.
    NEXO_SMTP_HOST: ${NEXO_SMTP_HOST:-}
    NEXO_SMTP_PORT: ${NEXO_SMTP_PORT:-}
    NEXO_SMTP_USER: ${NEXO_SMTP_USER:-}
    NEXO_SMTP_PASSWORD: ${NEXO_SMTP_PASSWORD:-}
    NEXO_SMTP_FROM: ${NEXO_SMTP_FROM:-}
    NEXO_SMTP_STARTTLS: ${NEXO_SMTP_STARTTLS:-1}
    DAGSTER_HOME: /dagster-home # Dagster's run history, kept on a volume across restarts
  volumes:
    - demo-data:/demo-data
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *py
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"] # reach a model server on the host, on Linux too
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The fake source systems. On first start it writes the synthetic source files to demo-data.
  mock-sources:
    <<: *py
    pull_policy: never # built by api
    command: uvicorn services.mock_sources.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once at startup so the warehouse is loaded before anything reads it. Dagster then
  # repeats the same run every hour.
  pipeline:
    <<: *py
    pull_policy: never # built by api
    command: python -m data.pipelines.cli run
    depends_on:
      postgres:
        condition: service_healthy
      mock-sources:
        condition: service_healthy

  # Delivers approved emails (apps/api/outbox.py); without NEXO_SMTP_HOST it only logs them.
  outbox:
    <<: *py
    pull_policy: never # built by api
    command: python -m apps.api.outbox
    depends_on:
      api:
        condition: service_healthy # the API applies the migrations that create the outbox

  dagster:
    <<: *py
    pull_policy: never # built by api
    command: dagster dev -h 0.0.0.0 -p 3001 -m data.pipelines.definitions
    ports: ["3001:3001"]
    volumes:
      - demo-data:/demo-data
      - dagster-home:/dagster-home
    depends_on:
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:3001/server_info')"]
      interval: 5s
      timeout: 3s
      retries: 40

  web:
    build: apps/web
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  demo-data:
  dagster-home:
