[project]
name = "nexo"
version = "0.1.0"
description = "Self-hostable customer-success assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/api/tests", "data/tests", "services/mock_sources/tests"]

[tool.ruff]
line-length = 100
