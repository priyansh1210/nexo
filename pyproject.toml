[project]
name = "nexo"
version = "0.1.0"
description = "Self-hostable customer-success assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dbt-core>=1.10",
    "dbt-postgres>=1.9",
    "httpx>=0.27",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "anthropic>=0.60",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "testcontainers[postgres]>=4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/api/tests", "data/tests", "services/mock_sources/tests", "evals"]

[tool.ruff]
line-length = 100
