# Connection details come from DATABASE_URL; data/pipelines/runner.py splits it into these variables.
nexo:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('NEXO_PG_HOST') }}"
      port: "{{ env_var('NEXO_PG_PORT') | int }}"
      user: "{{ env_var('NEXO_PG_USER') }}"
      password: "{{ env_var('NEXO_PG_PASSWORD') }}"
      dbname: "{{ env_var('NEXO_PG_DBNAME') }}"
      schema: staging
      threads: 4
